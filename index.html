<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Наши задачи</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #1a1a1a);
            padding: 16px;
            min-height: 100vh;
        }
        h1 {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 16px;
            color: var(--tg-theme-text-color, #1a1a1a);
        }
        .section-title {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #8e8e93);
            margin: 16px 0 8px;
            letter-spacing: 0.3px;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f2f2f7);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 8px;
            border-left: 3px solid #A67B8C;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .card.done {
            opacity: 0.6;
            border-left-color: #8E8E93;
        }
        .card.done .content {
            text-decoration: line-through;
        }
        .content {
            font-size: 15px;
            flex: 1;
            line-height: 1.4;
        }
        .badge {
            font-size: 10px;
            color: var(--tg-theme-hint-color, #8e8e93);
            margin-top: 2px;
        }
        .btn-toggle {
            background: transparent;
            border: 1px solid var(--tg-theme-hint-color, #c7c7cc);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12px;
            color: var(--tg-theme-link-color, #A67B8C);
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-toggle:active { opacity: 0.5; }
        .input-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .input-row input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid var(--tg-theme-hint-color, #c7c7cc);
            border-radius: 8px;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #1a1a1a);
            font-size: 14px;
            outline: none;
        }
        .input-row select {
            padding: 10px 8px;
            border: 1px solid var(--tg-theme-hint-color, #c7c7cc);
            border-radius: 8px;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #1a1a1a);
            font-size: 13px;
        }
        .btn-add {
            width: 100%;
            margin-top: 8px;
            padding: 12px;
            background: transparent;
            border: 1px solid #A67B8C;
            border-radius: 10px;
            color: #A67B8C;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-add:active { opacity: 0.5; }
        .empty {
            text-align: center;
            padding: 30px 0;
            color: var(--tg-theme-hint-color, #8e8e93);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>🌸 Наши задачи</h1>

    <div class="section-title">ГЛОБАЛЬНЫЕ</div>
    <div id="global-list"></div>

    <div class="section-title">НА СЕГОДНЯ</div>
    <div id="daily-list"></div>

    <div class="section-title">НОВАЯ ЗАДАЧА</div>
    <div class="input-row">
        <input type="text" id="task-input" placeholder="Что нужно сделать?">
        <select id="task-type">
            <option value="daily">На сегодня</option>
            <option value="global">Глобальная</option>
        </select>
    </div>
    <button class="btn-add" onclick="addTask()">Добавить</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const API_BASE = "https://your-domain.com"; // заменить на ваш домен

        async function loadTasks() {
            try {
                const resp = await fetch(`${API_BASE}/api/tasks/list`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ init_data: tg.initData })
                });
                if (!resp.ok) throw new Error('Load failed');
                const tasks = await resp.json();

                const globalList = document.getElementById('global-list');
                const dailyList = document.getElementById('daily-list');
                globalList.innerHTML = '';
                dailyList.innerHTML = '';

                const globalTasks = tasks.filter(t => t.task_type === 'global');
                const dailyTasks = tasks.filter(t => t.task_type === 'daily');

                if (globalTasks.length === 0) globalList.innerHTML = '<div class="empty">Пока пусто</div>';
                else globalTasks.forEach(t => globalList.appendChild(renderTask(t)));

                if (dailyTasks.length === 0) dailyList.innerHTML = '<div class="empty">Пока пусто</div>';
                else dailyTasks.forEach(t => dailyList.appendChild(renderTask(t)));
            } catch (e) {
                console.error(e);
            }
        }

        function renderTask(task) {
            const div = document.createElement('div');
            div.className = 'card' + (task.status === 'done' ? ' done' : '');
            div.innerHTML = `
                <div class="content">${escapeHtml(task.content)}
                    <div class="badge">${task.status === 'done' ? 'выполнено' : 'в процессе'}</div>
                </div>
                <button class="btn-toggle" onclick="toggleTask(${task.id})">
                    ${task.status === 'done' ? '↩' : '✓'}
                </button>
            `;
            return div;
        }

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        async function toggleTask(taskId) {
            try {
                await fetch(`${API_BASE}/api/tasks/toggle`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ init_data: tg.initData, task_id: taskId })
                });
                loadTasks();
            } catch (e) {
                console.error(e);
            }
        }

        async function addTask() {
            const input = document.getElementById('task-input');
            const type = document.getElementById('task-type').value;
            const content = input.value.trim();
            if (!content) return;

            try {
                await fetch(`${API_BASE}/api/tasks/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        init_data: tg.initData,
                        task_type: type,
                        content: content
                    })
                });
                input.value = '';
                loadTasks();
            } catch (e) {
                console.error(e);
            }
        }

        loadTasks();
    </script>
</body>

</html>
