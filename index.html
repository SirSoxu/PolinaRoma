<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Наши задачи</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #faf9f8);
            color: var(--tg-theme-text-color, #333333);
            padding: 16px;
            min-height: 100vh;
        }

        /* Заголовок */
        h1 {
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 20px;
            color: var(--tg-theme-text-color, #2c2c2c);
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* Вкладки */
        .tabs {
            display: flex;
            background: var(--tg-theme-secondary-bg-color, #f0eceb);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            font-size: 14px;
            font-weight: 500;
            color: var(--tg-theme-hint-color, #8e8e93);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab.active {
            background: var(--tg-theme-bg-color, #ffffff);
            color: #A67B8C; /* Приглушенный сливовый */
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        /* Контент вкладок */
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Карточки задач */
        .card {
            background: var(--tg-theme-secondary-bg-color, #f7f5f4);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            border-left: 3px solid #A67B8C;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            transition: transform 0.1s;
        }
        .card:active {
            transform: scale(0.99);
        }
        
        /* Стили для выполненных задач */
        .card.done {
            opacity: 0.65;
            border-left-color: #c7c7cc;
        }
        .card.done .content {
            text-decoration: line-through;
            color: var(--tg-theme-hint-color, #8e8e93);
        }

        .content {
            font-size: 15px;
            flex: 1;
            line-height: 1.4;
        }
        .badge {
            font-size: 11px;
            color: var(--tg-theme-hint-color, #8e8e93);
            margin-top: 6px;
            letter-spacing: 0.3px;
        }

        /* Кнопки на карточках */
        .btn-toggle {
            background: transparent;
            border: 1px solid var(--tg-theme-hint-color, #c7c7cc);
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 14px;
            color: #A67B8C;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-toggle:active { opacity: 0.5; }

        /* Форма добавления */
        .input-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .input-row input {
            flex: 1;
            padding: 14px 16px;
            border: 1px solid var(--tg-theme-hint-color, #e0e0e0);
            border-radius: 12px;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #333333);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-row input:focus {
            border-color: #A67B8C;
        }
        .input-row select {
            padding: 14px 8px;
            border: 1px solid var(--tg-theme-hint-color, #e0e0e0);
            border-radius: 12px;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #333333);
            font-size: 14px;
            outline: none;
        }
        .btn-add {
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            background: transparent;
            border: 2px solid #A67B8C;
            border-radius: 12px;
            color: #A67B8C;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-add:active {
            background: #A67B8C;
            color: #ffffff;
        }

        /* Заглушка / Пустой экран */
        .empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--tg-theme-hint-color, #8e8e93);
            font-size: 14px;
            line-height: 1.6;
        }

        .section-title {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #8e8e93);
            margin: 20px 0 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Наши задачи</h1>

    <!-- Переключатель вкладок -->
    <div class="tabs">
        <div class="tab active" onclick="switchTab('create')">Создание</div>
        <div class="tab" onclick="switchTab('partner')">Задачи партнера</div>
    </div>

    <!-- Вкладка 1: Создание и просмотр СВОИХ задач -->
    <div id="tab-create" class="tab-content active">
        <div class="section-title">Мои задачи</div>
        <div id="my-tasks-list">
            <!-- Здесь будут отображаться задачи, созданные вами -->
        </div>

        <div class="section-title" style="margin-top: 30px;">Добавить новую</div>
        <div class="input-row">
            <input type="text" id="task-input" placeholder="Что нужно сделать?">
            <select id="task-type">
                <option value="daily">На сегодня</option>
                <option value="global">Глобальная</option>
            </select>
        </div>
        <button class="btn-add" onclick="addTask()">Добавить</button>
    </div>

    <!-- Вкладка 2: Просмотр задач ПАРТНЕРА -->
    <div id="tab-partner" class="tab-content">
        <div class="section-title">Задачи партнера</div>
        <div id="partner-tasks-list">
            <!-- Здесь будут отображаться задачи партнера -->
        </div>
    </div>

    <script>
        // Безопасное подключение к Telegram
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        // Временно используем заглушку для демонстрации дизайна.
        // Когда будет готов бэкенд, мы заменим это на реальные запросы.
        const API_BASE = "https://your-domain.com";
        
        // Функция переключения вкладок
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            if (tabName === 'create') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('tab-create').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('tab-partner').classList.add('active');
            }
        }

        // Функция отрисовки карточек
        function renderTask(task, isPartner) {
            const div = document.createElement('div');
            div.className = 'card' + (task.status === 'done' ? ' done' : '');
            div.innerHTML = `
                <div class="content">${escapeHtml(task.content)}
                    <div class="badge">${task.task_type === 'global' ? 'Глобальная' : 'На сегодня'} • ${task.status === 'done' ? 'выполнено' : 'в процессе'}</div>
                </div>
                ${!isPartner ? `<button class="btn-toggle" onclick="toggleTask(${task.id})">${task.status === 'done' ? '↩' : '✓'}</button>` : ''}
            `;
            return div;
        }

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        // Загрузка задач (ВРЕМЕННАЯ ЗАГЛУШКА ДЛЯ ТЕСТА ДИЗАЙНА)
        async function loadTasks() {
            const myList = document.getElementById('my-tasks-list');
            const partnerList = document.getElementById('partner-tasks-list');

            // Временные тестовые данные
            const mockMyTasks = [
                { id: 1, content: "Купить цветы по дороге домой", task_type: "daily", status: "pending" },
                { id: 2, content: "Забронировать столик в ресторане", task_type: "global", status: "done" }
            ];

            const mockPartnerTasks = [
                { id: 3, content: "Приготовить ужин", task_type: "daily", status: "pending" },
                { id: 4, content: "Написать мне, как доберешься", task_type: "global", status: "done" }
            ];

            // Отрисовка
            myList.innerHTML = '';
            if (mockMyTasks.length === 0) myList.innerHTML = '<div class="empty">У вас пока нет задач. Самое время добавить!</div>';
            else mockMyTasks.forEach(t => myList.appendChild(renderTask(t, false)));

            partnerList.innerHTML = '';
            if (mockPartnerTasks.length === 0) partnerList.innerHTML = '<div class="empty">У партнера пока нет задач.</div>';
            else mockPartnerTasks.forEach(t => partnerList.appendChild(renderTask(t, true)));
        }

        // Заглушка для кнопки "Сделано" (позже заменим на запрос к серверу)
        async function toggleTask(taskId) {
            console.log('Отмечаем задачу ID:', taskId);
            // В реальной версии здесь будет:
            // await fetch(`${API_BASE}/api/tasks/toggle`, ...)
            // loadTasks();
        }

        // Заглушка для кнопки "Добавить" (позже заменим на запрос к серверу)
        async function addTask() {
            const input = document.getElementById('task-input');
            if (!input.value.trim()) return;
            
            console.log('Добавляем задачу:', input.value, document.getElementById('task-type').value);
            input.value = '';
            // В реальной версии здесь будет:
            // await fetch(`${API_BASE}/api/tasks/create`, ...)
            // loadTasks();
        }

        // Запуск при загрузке
        loadTasks();
    </script>
</body>
</html>
